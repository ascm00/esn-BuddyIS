name: Deploy

on:
  push:
    branches:
      - 'deploy/prod'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and deploy Contember to production
        run: yarn run deploy ${{ secrets.CONTEMBER_DEPLOY_DSN }} --yes


  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_56EF959E17D54687965A76F3CA572ADF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8521818BEEF94FAD9097585AD0CD8C34 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B4CB397F3892495B99A4FF50105510B8 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Buddyistest'
          slot-name: 'Production'
          package: .

